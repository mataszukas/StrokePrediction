<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Stroke Prediction Model</title>
</head>
<body>
    <h2>Input features to predict prognosis</h2>

    <!-- Load model button and status -->
    <button id="loadBtn" type="button">Load Model</button>
    <div id="status" style="margin-top:8px"></div>

    <!-- Prediction form -->
    <form id="predictForm">
        <label>Gender:
            <select id="gender">
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>
        </label><br/>
        <label>Age:
            <input id="age" type="number" step="0.1" value="45"/>
        </label><br/>
        <label>Hypertension:
            <select id="hypertension">
                <option value="0">0</option>
                <option value="1">1</option>
            </select>
        </label><br/>
        <label>Heart disease:
            <select id="heart_disease">
                <option value="0">0</option>
                <option value="1">1</option>
            </select>
        </label><br/>
        <label>Ever married:
            <select id="ever_married">
                <option>No</option>
                <option>Yes</option>
            </select>
        </label><br/>
        <label>Work type:
            <select id="work_type">
                <option>Private</option>
                <option>Self-employed</option>
                <option>Govt_job</option>
                <option>children</option>
                <option>Never_worked</option>
            </select>
        </label><br/>
        <label>Residence type:
            <select id="Residence_type">
                <option>Urban</option>
                <option>Rural</option>
            </select>
        </label><br/>
        <label>Avg glucose level:
            <input id="avg_glucose_level" type="number" step="0.1" value="85"/>
        </label><br/>
        <label>BMI:
            <input id="bmi" type="number" step="0.1" value="25"/>
        </label><br/>
        <label>Smoking status:
            <select id="smoking_status">
                <option>formerly smoked</option>
                <option>never smoked</option>
                <option>smokes</option>
                <option>Unknown</option>
            </select>
        </label><br/>
        <button type="submit">Predict</button>
    </form>

    <h3>Or upload CSV (header + any number of data rows)</h3>
    <input id="csvfile" type="file" accept=".csv" />
    <button id="csvBtn" type="button">Predict from CSV</button>

    <h3>Result</h3>
    <pre id="out">No result yet</pre>

    <script>
        // wire up events
        document.getElementById('loadBtn').addEventListener('click', loadModel);
        document.getElementById('csvBtn').addEventListener('click', predictFromFile);
        document.getElementById('predictForm').addEventListener('submit', function(e){
            e.preventDefault();
            submitForm();
        });

        async function loadModel(){
            const btn = document.getElementById('loadBtn');
            const statusEl = document.getElementById('status');
            if (btn) btn.disabled = true;
            if (statusEl) statusEl.textContent = 'Loading...';
            try {
                const controller = new AbortController();
                const timeout = setTimeout(()=>controller.abort(), 60000);
                const resp = await fetch('/load-model', { method: 'POST', signal: controller.signal });
                clearTimeout(timeout);
                if (!resp.ok) throw new Error(`Server returned ${resp.status}`);
                const ct = (resp.headers.get('content-type') || '').toLowerCase();
                let data;
                if (ct.includes('application/json')) {
                    try { data = await resp.json(); } catch { data = { status: await resp.text() }; }
                } else {
                    data = { status: await resp.text() };
                }
                if (statusEl) statusEl.textContent = data.status ?? (data.model_loaded ? 'Model loaded' : 'Loaded');
            } catch (err) {
                if (statusEl) statusEl.textContent = 'Error: ' + (err.message || err);
                console.error(err);
            } finally {
                if (btn) btn.disabled = false;
            }
        }

        function parseCsvAll(text){
            if (text == null) return [];
            if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
            const rows = [];
            let cur = '', row = [], inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const ch = text[i], next = text[i+1];
                if (inQuotes) {
                    if (ch === '"') {
                        if (next === '"') { cur += '"'; i++; } else { inQuotes = false; }
                    } else { cur += ch; }
                } else {
                    if (ch === '"') { inQuotes = true; }
                    else if (ch === ',') { row.push(cur); cur = ''; }
                    else if (ch === '\r') { if (next === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
                    else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
                    else { cur += ch; }
                }
            }
            if (inQuotes) { row.push(cur); rows.push(row); }
            else if (cur !== '' || row.length > 0) { row.push(cur); rows.push(row); }

            const clean = rows.map(r => r.map(f => (f == null ? '' : String(f).trim())));
            const filtered = clean.filter(r => r.some(f => f !== ''));
            if (filtered.length < 1) return [];
            const headers = filtered[0].map(h => String(h).trim());
            const dataRows = filtered.slice(1);
            return dataRows.map(r => {
                const obj = {};
                headers.forEach((h, i) => { obj[h] = r[i] !== undefined ? r[i] : ""; });
                return obj;
            });
        }

        function normalizeRecord(rec){
            const toFloat = v => {
                if (v === null || v === undefined || v === "") return null;
                const n = parseFloat(String(v)); return Number.isFinite(n) ? n : null;
            };
            const toInt = v => {
                if (v === null || v === undefined || v === "") return null;
                const n = parseInt(String(v), 10); return Number.isFinite(n) ? n : null;
            };
            const out = { ...rec };
            out.age = toFloat(out.age);
            out.avg_glucose_level = toFloat(out.avg_glucose_level);
            out.bmi = toFloat(out.bmi);
            out.hypertension = toInt(out.hypertension);
            out.heart_disease = toInt(out.heart_disease);
            const trimOrNull = v => (v === undefined || v === null || String(v).trim() === "") ? null : String(v).trim();
            out.gender = trimOrNull(out.gender);
            out.ever_married = trimOrNull(out.ever_married);
            out.work_type = trimOrNull(out.work_type);
            out.Residence_type = trimOrNull(out.Residence_type);
            out.smoking_status = trimOrNull(out.smoking_status);
            delete out.id;
            return out;
        }

        async function predictFromFile(){
            const f = document.getElementById('csvfile')?.files?.[0];
            const outEl = document.getElementById('out');
            if (!outEl) return;
            if (!f) { outEl.textContent = 'No file selected'; return; }
            outEl.textContent = 'Reading file...';
            try {
                const txt = await f.text();
                const raw = parseCsvAll(txt);
                if (!raw.length) { outEl.textContent = 'CSV must have header and at least one data row'; return; }
                const recs = raw.map(normalizeRecord);
                outEl.textContent = `Sending ${recs.length} record(s) for prediction...`;
                await doPredict(recs);
            } catch (err) {
                outEl.textContent = 'Error: ' + err;
                console.error(err);
            }
        }

        async function submitForm(){
            const outEl = document.getElementById('out');
            if (!outEl) return;
            const safeFloat = v => {
                if (v === null || v === undefined || v === "") return null;
                const n = parseFloat(String(v)); return Number.isFinite(n) ? n : null;
            };
            const safeInt = v => {
                if (v === null || v === undefined || v === "") return null;
                const n = parseInt(String(v), 10); return Number.isFinite(n) ? n : null;
            };
            const trimOrNull = v => (v === undefined || v === null || String(v).trim() === "") ? null : String(v).trim();

            const rec = {
                gender: trimOrNull(document.getElementById('gender')?.value),
                age: safeFloat(document.getElementById('age')?.value),
                hypertension: safeInt(document.getElementById('hypertension')?.value),
                heart_disease: safeInt(document.getElementById('heart_disease')?.value),
                ever_married: trimOrNull(document.getElementById('ever_married')?.value),
                work_type: trimOrNull(document.getElementById('work_type')?.value),
                Residence_type: trimOrNull(document.getElementById('Residence_type')?.value),
                avg_glucose_level: safeFloat(document.getElementById('avg_glucose_level')?.value),
                bmi: safeFloat(document.getElementById('bmi')?.value),
                smoking_status: trimOrNull(document.getElementById('smoking_status')?.value)
            };

            await doPredict([rec]);
            return false;
        }

        async function doPredict(records){
            const outEl = document.getElementById('out');
            if (!outEl) { console.error("out element not found"); return; }
            outEl.textContent = 'Requesting...';
            try {
                const resp = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ records })
                });
                const ct = (resp.headers.get('content-type') || '').toLowerCase();
                let data;
                if (ct.includes('application/json')) {
                    try { data = await resp.json(); } catch (e) { data = { error: 'invalid json', raw: await resp.text() }; }
                } else { data = await resp.text(); }

                if (!resp.ok) {
                    outEl.textContent = 'Error: ' + (typeof data === 'string' ? data : JSON.stringify(data, null, 2));
                    console.error("Server error", resp.status, data);
                    return;
                }
                outEl.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
                console.log("Predict response", data);
            } catch (err) {
                outEl.textContent = 'Error: ' + (err && err.message ? err.message : String(err));
                console.error(err);
            }
        }
    </script>
</body>
</html>
